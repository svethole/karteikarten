# Karteikarten – nginx-Konfiguration für karteikarten.svetho.net
#
# Ziel: /etc/nginx/sites-available/karteikarten.svetho.net (+ Symlink nach sites-enabled/)
# HTTPS ergänzt certbot selbst:  sudo certbot --nginx -d karteikarten.svetho.net
#
# Zugang nur angemeldet über die gemeinsame svetho-Anmeldung ($svetho_sso_ok aus svetho-portal).
# nginx liefert nur public/ aus; lib/, data/, bin/ und deploy/ liegen außerhalb und sind nie erreichbar.

server {
    listen 80;
    listen [::]:80;
    server_name karteikarten.svetho.net;

    root /var/www/karteikarten/public;
    index index.html;
    charset utf-8;
    client_max_body_size 60m;   # Bilder und Anki-Dateien (.apkg)

    set $sso_pruefen $svetho_sso_ok;
    if ($uri ~ ^/\.well-known/acme-challenge/) { set $sso_pruefen 1; }
    # Symbol und Manifest für „Zum Home-Bildschirm“: Handys holen sie teils ohne Anmelde-Cookie
    if ($uri ~ ^/(icons/|manifest\.webmanifest$)) { set $sso_pruefen 1; }
    if ($sso_pruefen = 0) { return 302 https://svetho.net/portal/?ziel=https://$host$request_uri; }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ { allow all; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Oberfläche nicht lange zwischenspeichern (der Service Worker hält sie offline bereit)
    location ~* \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
    location ^~ /schriften/ { expires 365d; }
    location ^~ /bilder/ { expires 30d; }

    # Einziger PHP-Einstieg
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 300;   # Abgleich und Anki-Import können dauern
        # Die svetho-Anmeldung sagt nur „angemeldet“. Ohne eigenen Namen nimmt die App standard_benutzer aus config.php.
        # fastcgi_param REMOTE_USER "svetho";
    }
    location ~ \.php$ { deny all; }
    location ~ /\. { deny all; }
}
